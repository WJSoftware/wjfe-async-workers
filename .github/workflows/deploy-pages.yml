name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: WJSoftware/cicd/.github/workflows/build-and-deploy-pages.yml@main
    with:
      project_folder: ./pages
      output_folder: build
      environment: Production
